<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/alt-path-style.css">
    <title>Path 2</title>
    <div class="top-left-image-container">
        <img src="../path1-image.png" alt="Credits">
        <img src="../path2-image.png" alt="Data">
    </div>
    <div class="top-right-timer-container">
        <p>Time left: <span id="timer">00:10</span></p>

        <button class = "button" onclick="document.location=`video7.html`">
        <img src = "../Camera Trap.gif" height = "350">
        </button>
        <p>Monitor the terrain</p>
    </div>
    <div class = "middle-button-container">
        <button class = "button" onclick="document.location=`video3.html`">
        <img src = "../Collect_Environmental_Data.gif" height = "350">

    </div>
    <div class = "alt-right-button-container">
        <button class = "button" onclick="document.location=`video5.html`">

        </button>
        <p>Finding Sentinel Species</p>
    </div>
    </div>
    <script>
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = "story3.html";
            } else {
                timerElement.textContent = `00:0${timeLeft}`;
                timeLeft--;
            }
        }, 1000);
    </script>
