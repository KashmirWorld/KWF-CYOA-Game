<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../css/alt-path-style.css">
  <title>Path 3</title>
</head>
<body>
  <div class="top-left-image-container">
    <img src="../path1-image.png" alt="Credits">
    <span id="credits-readout">Credits: 0</span>
    <span id="data-readout">Data: 0</span>
    <img src="../path2-image.png" alt="Data">
  </div>

  <div class="top-right-timer-container">
    <p>Time left: <span id="timer">00:10</span></p>
  </div>

  <div class="path-container">
    <h1>Your fate is in your hands.</h1>

    <div class="alt-left-button-container">
      <button class="button" id="monitor-terrain-btn">
        <img src="../Photos/Monitor the terrain.gif" height="350">
      </button>
      <p>Monitor the terrain</p>
    </div>

    <div class="middle-button-container">
      <button class="button" id="create-map-btn">
        <img src="../Photos/Drone Create Map.gif" height="350">
      </button>
      <p>Creating the map</p>
    </div>

    <div class="alt-right-button-container">
      <button class="button" id="sentinel-species-btn">
        <img src="../Photos/Simulations Back at the Station_1.gif" height="350">
      </button>
      <p>Finding Sentinel Species</p>
    </div>
  </div>

  <!-- Scripts (game-state first, then page-specific) -->
  <script src="../JavaScript/game-state.js"></script>
  <script src="../JavaScript/path3.js"></script>
</body>
</html>
