<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../css/alt-path-style.css">
  <title>Path 1</title>
</head>
<body>
  <div class="top-left-image-container">
    <img src="../Photos/IMG_9912.png" alt="Credits">
    <span id="credits-readout"></span>
    <img src="../Photos/IMG_9974.png" alt="Data">
  </div>

  <div class="top-right-timer-container">
    <p>Time left: <span id="timer">00:10</span></p>
  </div>

  <div class="path-container">
    <h1>Your fate is in your hands.</h1>

    <div class="left-button-container">
      <button class="button" id="explore-btn">
        <img src="../Photos/Explore the Forest.gif" height="350">
      </button>
      <p>Explore the Forest</p>
    </div>

    <div class="right-button-container">
      <button class="button" id="drone-btn">
        <img src="../Photos/Soar Over Canopy.gif" height="350">
      </button>
      <p>Soar Above</p>
    </div>
  </div>

  <script src="../JavaScript/game-state.js"></script>
  <script src="../JavaScript/path1.js"></script>
</body>
</html>
