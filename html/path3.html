<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../css/alt-path-style.css">
  <title>Path 2</title>
</head>
<body>

  <div class="top-left-image-container">
    <img src="" alt="Credits">
    <span id="credits-readout">Credits: 0</span>
    <span id="data-readout">Data: 0</span>
    <img src="" alt="Data">
  </div>

  <div class="top-right-timer-container">
    <p>Time left: <span id="timer">00:10</span></p>
  </div>

  <div class="path-container">
    <h1>Your fate is in your hands.</h1>

    <div class="alt-left-button-container">
      <button class="button" id="deploy-sensors-btn">
        <img src="../Photos/Camera Trap.gif" height="350" alt="Deploy Sensors">
      </button>
      <p>Deploy Sensors</p>
    </div>

    <div class="middle-button-container">
      <button class="button" id="collect-data-btn">
        <img src="../Photos/Collect_Environmental_Data.gif" height="350" alt="Collect Environmental Data">
      </button>
      <p>Collect Environmental Data</p>
    </div>

    <div class="alt-right-button-container">
      <button class="button" id="run-sim-btn">
        <img src="../Photos/Run Simulations Back at the Station_1.gif" height="350" alt="Run Simulations">
      </button>
      <p>Run Simulations</p>
    </div>
  </div>

  <!-- Audio elements (unchanged) -->
  <audio id="runSimulationsAudio" preload="auto">
    <source src="../Audio/RUN SIMULATIONS 1.wav" type="audio/wav">
  </audio>
  <audio id="CollectEnvironmentalDataAudio" preload="auto">
    <source src="../Audio/COLLECT ENVIRONMENT DATA.wav" type="audio/wav">
  </audio>
  <audio id="DeploySensorsAudio" preload="auto">
    <source src="../Audio/Camera trap with out beeps.wav" type="audio/wav">
  </audio>

  <!-- Scripts -->
  <script src="../JavaScript/game-state.js"></script>
  <script src="../JavaScript/path2.js"></script>
</body>
</html>
