<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Frequency Minigame</title>
    <style>
        /* Incorporating Audio Moth theme colors and styles */
        body {
            font-family: system-ui, sans-serif;
            color: #05303b;
            padding: 16px;
            background: linear-gradient(135deg, #0f4f3e 25%, #166b52 25%, #166b52 50%, #0f4f3e 50%, #0f4f3e 75%, #166b52 75%, #166b52 100%);
            background-size: 64px 64px;
            margin: 0;
            min-height: 100vh;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 20px;
        }

        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #145c4b;
        }

        .score {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .spectrum-container {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #145c4b;
            border-radius: 12px;
            padding: 20px;
            height: 300px;
            position: relative;
            overflow: hidden;
        }

        #spectrumCanvas {
            width: 100%;
            height: 100%;
        }

        .sound-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sound-card {
            background: #fff;
            border: 2px solid #145c4b;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            user-select: none;
        }

        .sound-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            border-color: #ffeb3b;
        }

        .sound-card.playing {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .sound-card.correct {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.3);
        }

        .sound-card.wrong {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.2);
        }

        .sound-name {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .play-btn {
            background: #145c4b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: auto;
        }

        .play-btn:hover {
            filter: brightness(1.1);
        }

        .feedback {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            margin: 20px 0;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback.correct {
            color: #4caf50;
        }

        .feedback.wrong {
            color: #f44336;
        }

        .controls {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: 2px solid #145c4b;
            background: #fff;
            color: #145c4b;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #145c4b;
            color: white;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(20, 92, 75, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 768px) {
            .game-container {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🔊 Sound Frequency Match</h1>
            <div class="score">Score: <span id="score">0</span></div>
        </div>

        <div class="spectrum-container">
            <canvas id="spectrumCanvas"></canvas>
        </div>

        <div class="sound-cards" id="soundCards"></div>

        <div class="feedback" id="feedback"></div>

        <div class="controls">
            <button class="btn" id="playSound">▶ Play Sound</button>
            <button class="btn btn-primary" id="nextRound">Next Round</button>
        </div>
    </div>

    <script>
        // Audio context for generating sounds
        let audioCtx;
        let currentOscillator = null;
        let currentGainNode = null;

        // Game state
        let score = 0;
        let currentRound = 0;
        let correctSound = null;
        let playedSound = false;

        // Sound definitions with frequency patterns
        const sounds = [
            {
                name: "Car Engine",
                freqs: [80, 120, 200, 350], // Low rumble frequencies
                type: 'sawtooth',
                duration: 2.5
            },
            {
                name: "Glass Clink",
                freqs: [800, 1200, 2200], // High clear tones
                type: 'sine',
                duration: 1.2
            },
            {
                name: "Bird Call",
                freqs: [600, 1400, 2800, 500], // Varied chirp
                type: 'sine',
                duration: 1.8
            },
            {
                name: "Chainsaw",
                freqs: [150, 250, 450, 750], // High energy buzz
                type: 'sawtooth',
                duration: 3.0
            }
        ];

        // Frequency spectrum visualization data
        let spectrumData = [];

        function init() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            setupEventListeners();
            nextRound();
        }

        function setupEventListeners() {
            document.getElementById('playSound').addEventListener('click', playCurrentSound);
            document.getElementById('nextRound').addEventListener('click', nextRound);
        }

        function nextRound() {
            currentRound++;
            correctSound = sounds[Math.floor(Math.random() * sounds.length)];
            
            // Generate shuffled options
            let options = [...sounds];
            options.sort(() => Math.random() - 0.5);
            options = options.slice(0, 4); // Ensure 4 options
            
            renderSoundCards(options);
            resetSpectrum();
            resetFeedback();
            playedSound = false;
            
            document.getElementById('playSound').disabled = false;
            document.getElementById('nextRound').disabled = true;
        }

        function renderSoundCards(options) {
            const container = document.getElementById('soundCards');
            container.innerHTML = options.map(sound => `
                <div class="sound-card" data-sound="${sound.name}">
                    <div class="sound-name">${sound.name}</div>
                    <button class="play-btn">Preview</button>
                </div>
            `).join('');

            // Add click listeners
            container.querySelectorAll('.sound-card').forEach(card => {
                card.addEventListener('click', () => selectSound(card));
                card.querySelector('.play-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    previewSound(card.dataset.sound);
                });
            });
        }

        function playCurrentSound() {
            if (!playedSound) {
                generateSound(correctSound);
                playedSound = true;
            }
        }

        function previewSound(soundName) {
            const sound = sounds.find(s => s.name === soundName);
            if (sound) {
                generateSound(sound);
            }
        }

        function generateSound(sound) {
            stopCurrentSound();
            
            sound.freqs.forEach((freq, index) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = sound.type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.8);
                }, index * 200);
            });
        }

        function selectSound(card) {
            if (!playedSound) return;
            
            const selectedSound = sounds.find(s => s.name === card.dataset.sound);
            const cards = document.querySelectorAll('.sound-card');
            
            cards.forEach(c => c.classList.remove('correct', 'wrong'));
            
            if (selectedSound.name === correctSound.name) {
                card.classList.add('correct');
                document.getElementById('feedback').textContent = '🎉 Correct! Great ear!';
                document.getElementById('feedback').className = 'feedback correct';
                score++;
                updateScore();
                document.getElementById('nextRound').disabled = false;
                document.getElementById('playSound').disabled = true;
            } else {
                card.classList.add('wrong');
                document.querySelector(`[data-sound="${correctSound.name}"]`).classList.add('correct');
                document.getElementById('feedback').textContent = `❌ Nope! It was ${correctSound.name}`;
                document.getElementById('feedback').className = 'feedback wrong';
                document.getElementById('nextRound').disabled = false;
                document.getElementById('playSound').disabled = true;
            }
        }

        function updateSpectrum(frequencies) {
            spectrumData = frequencies.map(f => ({
                freq: f,
                magnitude: Math.random() * 100 + 50 // Simulated visualization
            }));
            drawSpectrum();
        }

        function drawSpectrum() {
            const canvas = document.getElementById('spectrumCanvas');
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);

            // Draw frequency bars
            const barWidth = (rect.width / spectrumData.length) * 2;
            spectrumData.forEach((data, i) => {
                const barHeight = (data.magnitude / 100) * rect.height * 0.8;
                const x = i * barWidth;
                const y = rect.height - barHeight;

                ctx.fillStyle = `hsl(${data.freq / 10}, 70%, 50%)`;
                ctx.fillRect(x, y, barWidth * 0.7, barHeight);
                
                // Glow effect
                ctx.shadowColor = `hsl(${data.freq / 10}, 70%, 50%)`;
                ctx.shadowBlur = 10;
                ctx.fillRect(x, y, barWidth * 0.7, barHeight);
                ctx.shadowBlur = 0;
            });
        }

        function resetSpectrum() {
            spectrumData = [];
            const canvas = document.getElementById('spectrumCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function resetFeedback() {
            document.getElementById('feedback').textContent = 'Play the sound, then pick the matching visualization!';
            document.getElementById('feedback').className = 'feedback';
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        function stopCurrentSound() {
            if (currentOscillator) {
                currentOscillator.stop();
                currentOscillator.disconnect();
            }
        }

        // Animate idle spectrum
        setInterval(() => {
            if (spectrumData.length === 0) {
                const idleData = Array.from({length: 60}, () => ({
                    freq: Math.random() * 2000 + 20,
                    magnitude: Math.random() * 30 + 10
                }));
                updateSpectrum(idleData.map(d => d.freq));
            }
        }, 200);

        // Resume audio context on user interaction
        document.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true });

        init();
    </script>
</body>
</html>
