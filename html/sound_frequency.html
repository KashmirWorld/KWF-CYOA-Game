<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Frequency Minigame</title>
    <style>
        /* Incorporating Audio Moth theme colors and styles */
        body {
            font-family: system-ui, sans-serif;
            color: #05303b;
            padding: 16px;
            background: linear-gradient(135deg, #0f4f3e 25%, #166b52 25%, #166b52 50%, #0f4f3e 50%, #0f4f3e 75%, #166b52 75%, #166b52 100%);
            background-size: 64px 64px;
            margin: 0;
            min-height: 100vh;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 20px;
        }

        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #ffffff;
        }

        .score {
            font-size: 1.1rem;
            font-weight: 600;
            color:#ffffff;
        }

        .spectrum-container {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #145c4b;
            border-radius: 12px;
            padding: 20px;
            height: 300px;
            position: relative;
            overflow: hidden;
        }

        #spectrumCanvas {
            width: 100%;
            height: 100%;
        }

        .sound-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sound-card {
            background: #fff;
            border: 2px solid #145c4b;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            user-select: none;
        }

        .sound-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            border-color: #ffeb3b;
        }

        .sound-card.playing {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .sound-card.correct {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.3);
        }

        .sound-card.wrong {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.2);
        }

        .sound-card.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .sound-name {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .play-btn {
            background: #145c4b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: auto;
        }

        .play-btn:hover {
            filter: brightness(1.1);
        }

        .feedback {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color:#ffffff;
            margin: 20px 0;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback.correct {
            color: #89E88B;
        }

        .feedback.wrong {
            color: #f44336;
        }

        .controls {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: 2px solid #145c4b;
            background: #fff;
            color: #145c4b;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #145c4b;
            color: white;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(20, 92, 75, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 768px) {
            .game-container {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🔊 Sound Frequency Match</h1>
            <div class="score">Score: <span id="score">0</span></div>
        </div>

        <div class="spectrum-container">
            <canvas id="spectrumCanvas"></canvas>
        </div>

        <div class="sound-cards" id="soundCards"></div>

        <div class="feedback" id="feedback"></div>

        <div class="controls">
  <button class="btn" id="playSound">▶ Play Sound</button>
  <button class="btn btn-primary" id="nextRound">Next Round</button>
  <button class="btn" id="retry-btn" style="display:none;">Retry!</button>
  <button id="finishBtn" class="btn btn-primary" style="display:none;">Finish & Continue</button>
</div>

<script src="../JavaScript/game-state.js"></script>
<script>
  let audioCtx;
  let score = 0;
  let currentRound = 0;
  let correctSound = null;
  let playedSound = false;
  const TOTAL_ROUNDS = 5;
  const SUCCESS_THRESHOLD = 3;

  // New value that holds the previous correctSound
  let previousSound = null;

  const sounds = [
    { name: "Car Engine", freqs: [80, 120, 200, 350], type: "sawtooth", duration: 2.5 },
    { name: "Glass Clink", freqs: [800, 1200, 2200], type: "sine", duration: 1.2 },
    { name: "Bird Call", freqs: [600, 1400, 2800, 500], type: "sine", duration: 1.8 },
    { name: "Chainsaw", freqs: [150, 250, 450, 750], type: "sawtooth", duration: 3.0 }
  ];

  let spectrumData = [];

  function init() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    if (window.RainforestGame && typeof window.RainforestGame.initState === 'function') {
      window.RainforestGame.initState(100, 0);
      window.RainforestGame.updateUI();
    }

    setupEventListeners();
    nextRound();
  }

  function setupEventListeners() {
    document.getElementById('playSound').addEventListener('click', playCurrentSound);
    document.getElementById('nextRound').addEventListener('click', nextRound);
    document.getElementById('finishBtn').addEventListener('click', finishGame);
    document.getElementById('retry-btn').addEventListener('click', () => {
        window.location.reload();
    })
  }

  function nextRound() {
    if (currentRound >= TOTAL_ROUNDS) return;

    currentRound++;

    // Where the next round audio is selected. Randomize this.
    correctSound = sounds[Math.floor(Math.random() * sounds.length)];

    // While previousSound is defined and is the same as the new sound, keep randomizing until it isn't.
    while (previousSound != null && correctSound == previousSound)
    {
        correctSound = sounds[Math.floor(Math.random() * sounds.length)];
    }

    previousSound = correctSound;

    let options = [...sounds].sort(() => Math.random() - 0.5).slice(0, 4);
    renderSoundCards(options);
    resetSpectrum();
    resetFeedback();
    playedSound = false;

    document.getElementById('playSound').disabled = false;
    document.getElementById('nextRound').disabled = true;

    updateScoreDisplay();

    if (currentRound === TOTAL_ROUNDS) {
      document.getElementById('nextRound').textContent = 'Finish This Round';
    }
  }

  function finishGame() {
    if (currentRound < TOTAL_ROUNDS) {
      document.getElementById('feedback').textContent = `Finish all ${TOTAL_ROUNDS} rounds first.`;
      document.getElementById('feedback').className = 'feedback wrong';
      return;
    }

      disableSoundCards();

    if (score >= SUCCESS_THRESHOLD) 
    {
      if (window.RainforestGame && typeof window.RainforestGame.addData === 'function') 
      {
          window.RainforestGame.addData(2);
          window.RainforestGame.updateUI();
      }

      document.getElementById('finishBtn').addEventListener('click', () => {
        window.location.href = 'path3.html';
      });

      let feedbacktext = 'Excellent work. You identified the majority of sentinel species correctly. You may continue to the next path.';

      if (score == TOTAL_ROUNDS) 
      {
          feedbacktext = 'Excellent work! You identified all of the sentinel species correctly. You may continue to the next path.';
      }

      document.getElementById('feedback').textContent = feedbacktext;
      document.getElementById('feedback').className = 'feedback correct';
    }
    else
    {
      document.getElementById('feedback').textContent = `You finished with ${score}/${TOTAL_ROUNDS}. To move on, you need at least ${SUCCESS_THRESHOLD}/${TOTAL_ROUNDS} correct. Click the retry button to try again.`;
      document.getElementById('finishBtn').style.display = 'none';
      document.getElementById('retry-btn').style.display = 'inline-block';
      document.getElementById('feedback').className = 'feedback wrong';
    }
  }

  function selectSound(card) {
    if (!playedSound) return;

    const selectedSound = sounds.find(s => s.name === card.dataset.sound);
    const cards = document.querySelectorAll('.sound-card');
    cards.forEach(c => c.classList.remove('correct', 'wrong'));

    if (selectedSound.name === correctSound.name) {
      card.classList.add('correct');
      document.getElementById('feedback').textContent = '🎉 Correct! Great ear!';
      document.getElementById('feedback').className = 'feedback correct';
      score++;
    } else {
      card.classList.add('wrong');
      const correctCard = document.querySelector(`[data-sound="${correctSound.name}"]`);
      if (correctCard) correctCard.classList.add('correct');
      document.getElementById('feedback').textContent = `❌ Nope! It was ${correctSound.name}`;
      document.getElementById('feedback').className = 'feedback wrong';
    }

    updateScoreDisplay();
    document.getElementById('playSound').disabled = true;
    document.getElementById('nextRound').disabled = false;

    if (currentRound >= TOTAL_ROUNDS) {
      document.getElementById('nextRound').style.display = 'none';
      document.getElementById('finishBtn').style.display = 'inline-block';
    }
  }

  function updateScoreDisplay() {
    document.getElementById('score').textContent = `${score}/${currentRound}`;
  }

  function resetFeedback() {
    document.getElementById('feedback').textContent = 'Play the sound, then choose the correct match.';
    document.getElementById('feedback').className = 'feedback';
  }

  function renderSoundCards(options) {
    const container = document.getElementById('soundCards');
    container.innerHTML = options.map(sound => `
      <div class="sound-card" data-sound="${sound.name}">
        <div class="sound-name">${sound.name}</div>
        <button class="play-btn">Preview</button>
      </div>
    `).join('');

    container.querySelectorAll('.sound-card').forEach(card => {
      card.addEventListener('click', () => selectSound(card));
      card.querySelector('.play-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        previewSound(card.dataset.sound);
      });
    });
  }

  function disableSoundCards() {
      const container = document.getElementById('soundCards');
      container.querySelectorAll('.sound-card').forEach(card => card.classList.add('disabled'));
  }

  // Currently prevents current sound from being played again, good for challenge but not great if the player misses the initial sound.
  function playCurrentSound() {
    if (!playedSound) {
      generateSound(correctSound);
      playedSound = true;
    }
  }

  function previewSound(soundName) {
    const sound = sounds.find(s => s.name === soundName);
    if (sound) generateSound(sound);
  }

  function generateSound(sound) {
    updateSpectrum(sound.freqs);

    sound.freqs.forEach((freq, index) => {
      setTimeout(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = sound.type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      }, index * 200);
    });
  }

  function updateSpectrum(frequencies) {
    spectrumData = frequencies.map(f => ({
      freq: f,
      magnitude: Math.random() * 100 + 50
    }));
    drawSpectrum();
  }

  function drawSpectrum() {
    const canvas = document.getElementById('spectrumCanvas');
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();

    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.fillRect(0, 0, rect.width, rect.height);

    if (!spectrumData.length) return;

    const barWidth = rect.width / spectrumData.length;
    spectrumData.forEach((data, i) => {
      const barHeight = (data.magnitude / 150) * rect.height * 0.8;
      const x = i * barWidth;
      const y = rect.height - barHeight;

      ctx.fillStyle = `hsl(${data.freq / 10}, 70%, 50%)`;
      ctx.fillRect(x, y, barWidth * 0.7, barHeight);
    });
  }

  function resetSpectrum() {
    spectrumData = [];
    const canvas = document.getElementById('spectrumCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  document.addEventListener('click', () => {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }, { once: true });

  init();
</script>

<div id="tutorial-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: flex; justify-content: center; align-items: center; color: white;">
    <div style="background: #145c4b; padding: 30px; border-radius: 12px; max-width: 500px; text-align: center;">
        <h2 id="tutorial-title">Welcome!</h2>
        <p id="tutorial-text">Learn about sound waves!</p>
        <button id="next-tut-btn" class="btn btn-primary" style="margin-top: 20px;">Next</button>
    </div>
</div>
<script>
    const tutorialSteps = [
            {title: "Introduction", text: "We listen to and track animal calls in Tamandua to help track populations in the area. But to track animal calls, we first have to ask, what is sound?"},
            {title: "What are Sound Waves?", text: "Sound travels as a wave of vibrating air molecules. Sound waves are defined by their frequency, which is the number of vibrations per second."},
            {title: "Understanding Frequency", text: "Frequency is measured in Hertz (Hz). Higher frequency waves vibrate faster and sound higher in pitch, while lower frequency waves vibrate slower and sound lower."},
            {title: "How to Play", text: "In this game, you will listen to a specific sound frequency. Observe the visual wave spectrum and pick the card that matches what you hear. Remember, lower sound have lower bars and higher sounds have higher bars!"},
            {title: "Ready?", text: "You need to get at least 3 correct out of 5 rounds to win. Good luck!"}
        ];
    let step = 0;
    const modal = document.getElementById('tutorial-modal');
    const btn = document.getElementById('next-tut-btn');
    const title = document.getElementById('tutorial-title');
    const text = document.getElementById('tutorial-text');

    btn.addEventListener('click', () => {
        step++;
        if (step < tutorialSteps.length) {
            title.textContent = tutorialSteps[step].title;
            text.textContent = tutorialSteps[step].text;
            if (step === tutorialSteps.length - 1) btn.textContent = "Start Game";
        } else {
            modal.style.display = 'none';
        }
    });
</script>
</body>
</html>
