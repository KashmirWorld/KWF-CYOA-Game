<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="C:\Users\laure\Dropbox\KashmirProject\KWF-CYOA-Game\css\story-style.css">
  <meta charset="UTF-8" />
  <title>Scene 2: Waterfall</title>
</head>
<body>
  <div class="container">
    <h1>Scene 2: Waterfall</h1>

    <p>
      Midway through your expedition, you hear an eerie, rhythmic sound echoing through the trees. 
    </p>

    <!-- Live credits/data display -->
    <div id="stats-display" style="
      background: rgba(0,0,0,0.8); 
      color: white; 
      padding: 12px; 
      border-radius: 8px; 
      margin: 20px 0;
      font-family: system-ui, sans-serif;
      text-align: center;
    ">
      <span id="credits-readout">Credits: <span class="credits-value">$credits</span></span> | 
      <span id="data-readout">Data: <span class="data-value">$data</span></span>
    </div>

    <div class="button-container">
      <button id="next-btn" class="button">Next</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../JavaScript/game-state.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Update live stats display with game state
      RainforestGame.updateUI();

      // Next button → next scene (update to your next file)
      const nextBtn = document.getElementById('next-btn');
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          RainforestGame.updateUI(); // Final refresh before leaving
          window.location.href = 'WaterfallPath.html'; // Update to your next scene
        });
      } else {
        console.warn('Next button (#next-btn) not found');
      }
    });
  </script>
</body>
</html>
