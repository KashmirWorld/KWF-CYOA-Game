    <span class="project-text" id="project2" style="display:none" onclick="navigate(2)">UAV in Africa</span>

  <!-- <script src="js/map.js"></script> -->
  <script>
    function fancy_display(i) {
      document.getElementById('project' + i).style.display = 'block'; // show text
      document.getElementById('map-icon' + i).style.display = 'block'; // show map icon
      var pin = document.getElementById('pin' + i);
      pin.classList.add("floating"); // floating pin animation
    }
    function delay_display(i) {
      setTimeout(hide_display, 1000, i); // delay of 3000ms
    }
    function hide_display(i) {
      document.getElementById('project' + i).style.display = 'none'; // hide text
      document.getElementById('map-icon' + i).style.display = 'none'; // hide map icon
      var pin = document.getElementById('pin' + i);
      pin.classList.remove("floating");
    }
    function navigate(i) {
      switch(i) {
        case 1:
          window.location.href = "Slide4-mishell.html";
          break;
        case 2:
          window.location.href = "Slide3-uav.html";
          break;
        case 3:
          window.location.href = "Slide5-trinity.html";
          break;
        case 4:
          window.location.href = "Slide6-bioacoustics.html";
          break;
      }
    }
  </script>
